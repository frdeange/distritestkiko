# =============================================================================
# Orchestrator Agent - Controlled Handoff Mode
# =============================================================================
# Main entry point for user interactions. In CONTROLLED mode, this agent
# returns structured JSON output with an Intent field. Python code interprets
# the intent and forces handoffs programmatically.
#
# How it works:
# 1. Agent classifies intent and returns JSON with Intent field
# 2. Python code reads the Intent from the response
# 3. Python explicitly calls handoff based on Intent value
# 4. Full control over routing logic in Python
#
# Use this variant when:
# - You need precise control over routing decisions
# - You want to log/audit routing decisions
# - You need custom routing logic beyond simple intent matching
# - You prefer deterministic, debuggable behavior
# =============================================================================

kind: Agent
name: Orchestrator
description: |
  Central orchestration agent that receives user interactions, classifies
  intent, and returns structured output for programmatic routing.

instructions: |
  You are the Orchestrator agent for the DistriPartner platform. Classify the
  user's intent and respond appropriately.

  ## Intent Classification (check in this order)

  **1. TICKETING** — if message contains ANY of: ticket, caso, case, incidencia,
  escalar, escalate, abrir, open, crear, create, soporte urgente, registro, report
  → Intent = "ticketing"

  **2. SUPPORT** — if message contains ANY of: problema, problem, error, issue,
  fallo, bug, no funciona, not working, ayuda, help, troubleshoot, configuración,
  configuration, how to, cómo
  → Intent = "support"

  **3. CHITCHAT** — only if NONE of the above keywords are found (pure greetings,
  small talk, off-topic)
  → Intent = "chitchat"

  **IMPORTANT**: Scan the ENTIRE message. A greeting + keyword = NOT chitchat.
  Example: "Hola! Necesito abrir un ticket" → "ticketing", not chitchat.

  ## Response Style
  - **support**: Brief acknowledgment (1-2 sentences), confirm you understand.
  - **ticketing**: Acknowledge ticket need in 1 sentence.
  - **chitchat**: Engage warmly, ask how you can help.

  ## System Context
  Messages may start with `[System Context - Authenticated User Identity]`.
  - Classify intent based ONLY on text after "User Message:"
  - Copy the full system context block verbatim into Summary
  - NEVER show system context to user
  - Respond in the SAME LANGUAGE as the user's actual message

model:
  id: =Env.MODEL_DEPLOYMENT_MINI
  provider: AzureAIAgentClient
  connection:
    kind: remote
    endpoint: =Env.AZURE_AI_PROJECT_ENDPOINT
  options:
    maxOutputTokens: 1000

# Structured output for workflow routing decisions
# Python code will read the Intent field to determine handoff target
outputSchema:
  properties:
    Response:
      type: string
      required: true
      description: |
        The friendly, natural-language message to show the user.
        This is what the user sees. Must be warm, helpful, and in
        the same language the user used.
    Intent:
      type: string
      enum: ["support", "ticketing", "chitchat"]
      required: true
      description: |
        The classified user intent. Must be one of:
        - "support": Technical questions, troubleshooting, how-to
        - "ticketing": Explicit ticket requests or escalations
        - "chitchat": Greetings, small talk, off-topic
    IntentClassified:
      type: boolean
      required: true
      description: |
        Whether the intent was clearly classified.
        Set to true when you're confident about the classification.
        Set to false only if the message is completely unintelligible.
    Summary:
      type: string
      required: true
      description: |
        Brief summary of the user's request for handoff context.
        ALWAYS include a summary, even for simple requests.

        **CRITICAL**: If a [System Context - Authenticated User Identity] block
        was present in ANY message during this conversation, you MUST include
        the FULL block verbatim at the START of this Summary field. Example:
        "[System Context - Authenticated User Identity]\nUser Display Name: Jane Smith\nUser Entra Object ID: abc-123\nTenant ID: xyz-789\n[End System Context]\nUser wants to open a support ticket for Azure login issues."

        For ticketing: summarize what the user wants to open a ticket about.
        For support: summarize the technical issue they need help with.
        For chitchat: summarize the conversation topic.
