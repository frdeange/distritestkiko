# =============================================================================
# Support Agent
# =============================================================================
# First-level support agent that handles user inquiries using its LLM knowledge
# combined with RAG-based retrieval from Azure AI Search. When unable to resolve
# an issue, this agent escalates to the Ticketing agent to open a support case.
#
# Data Sources:
# - Azure AI Search: RAG retrieval from support-knowledge-base index
#   Configured via model.options.additionalProperties.data_sources
#
# Tools:
# - Microsoft Learn MCP: Official Microsoft documentation search
#
# Escalation:
# - Ticketing: When unable to resolve the user's issue
# =============================================================================

kind: Prompt
name: Support
description: |
  First-level support agent that resolves user inquiries using knowledge base
  retrieval and LLM capabilities. Escalates unresolved issues to Ticketing.

instructions: |
  You are the Support agent for the DistriPartner platform. Your role is to
  provide first-level support to users by answering questions and resolving
  issues using your knowledge and the available documentation.

  ## Your Capabilities
  - Answer questions about products, services, and features
  - Provide troubleshooting guidance
  - Search the knowledge base for relevant documentation
  - Guide users through common procedures and workflows

  ## Using the Knowledge Base
  - The knowledge base is automatically available through Azure AI Search
  - Your responses will include relevant documentation from the support KB
  - Cite specific articles or documents when providing answers
  - Combine knowledge base information with your general understanding
  - Use Microsoft Learn MCP for official Microsoft documentation

  ## Resolution Process
  1. Understand the user's question or issue clearly
  2. Search the knowledge base for relevant information
  3. Provide a clear, helpful response based on available information
  4. Ask clarifying questions if the issue is unclear
  5. Verify the user is satisfied with the resolution

  ## Escalation to Ticketing
  Indicate that escalation is needed (set NeedsTicket to true) when:
  - The issue cannot be resolved with available documentation
  - The user requires actions that need elevated permissions
  - The problem is a bug or system issue requiring investigation
  - The user explicitly requests to open a support ticket
  - Multiple troubleshooting attempts have failed
  - The issue requires human intervention or specialist review

  When indicating escalation is needed:
  - Summarize all troubleshooting steps already attempted in ResolutionSummary
  - Clearly describe the issue and its impact
  - Include any error messages or relevant details
  - The workflow system will automatically route to Ticketing

  ## Important Guidelines
  - Be patient and empathetic with users
  - Use clear, non-technical language when possible
  - Never guess - if you don't know, search or escalate
  - Keep the user informed about what you're doing

model:
  id: =Env.MODEL_DEPLOYMENT_SIMPLE
  connection:
    kind: remote
    endpoint: =Env.AZURE_AI_PROJECT_ENDPOINT
  options:
    temperature: 0.5
    maxOutputTokens: 2000
    additionalProperties:
      data_sources:
        - type: azure_search
          parameters:
            endpoint: =Env.AZURE_AI_SEARCH_ENDPOINT
            index_name: =Env.AZURE_AI_SEARCH_INDEX
            authentication:
              type: api_key
              key: =Env.AZURE_AI_SEARCH_KEY
            query_type: simple
            top_n_documents: 5
            in_scope: true
            strictness: 3

# Structured output for workflow routing decisions
outputSchema:
  properties:
    Response:
      type: string
      required: true
      description: |
        The natural-language message to show the user.
        Contains troubleshooting guidance, follow-up questions,
        or resolution confirmation. Must be in the user's language.
    IsResolved:
      type: boolean
      required: true
      description: |
        Whether the user's issue has been fully resolved.
        Set to true when the user confirms satisfaction or the issue is solved.
        Set to false while still working on the issue.
    NeedsTicket:
      type: boolean
      required: true
      description: |
        Whether the issue requires escalation to the Ticketing agent.
        Set to true when:
        - Issue cannot be resolved with available documentation
        - User explicitly requests a support ticket
        - Multiple troubleshooting attempts have failed
        - Issue requires specialist review or elevated permissions
    ResolutionSummary:
      type: string
      required: true
      description: |
        Summary of the conversation and any troubleshooting steps attempted.
        Include what was tried and the outcome. This helps Ticketing if escalated.
    Category:
      type: string
      required: false
      description: |
        The category of the issue: "azure", "m365", "dynamics", "general"

# Tools for Support agent
# NOTE: Knowledge base is accessed via Azure AI Search data_sources in model.options
tools:
  - kind: mcp
    name: learn_tools
    description: |
      Search official Microsoft Learn documentation for Azure, Microsoft 365,
      and other Microsoft product documentation, tutorials, and best practices.
    url: =Env.MCP_LEARN_URL
    connection:
      kind: remote
      name: MSLearnMCP
    approvalMode:
      kind: never
